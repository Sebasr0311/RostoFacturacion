name: Deploy Frontend a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite crear/actualizar la rama gh-pages (publicación del frontend).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
        env:
          # URL pública de la API en Render. Configúrala como variable
          # (Settings -> Variables) del repositorio: VITE_API_URL=https://tu-api.onrender.com/api
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages