# Blueprint de Render — despliegue del backend como Web Service.
# Usa "Blueprint" en Render (New + -> Blueprint) apuntando a este repositorio,
# o crea un Web Service manual apuntando al rootdir /backend.
#
# Las variables con `sync: false` se solicitan al momento del despliegue.
# Conexión a Oracle ATP SIN wallet (mTLS deshabilitado, TLS): el pool usa el
# connection string *_tp directamente; NO se define ORACLE_WALLET_DIR.
services:
  - type: web
    name: rosto-facturacion-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # ---- Oracle Autonomous Database (TLS sin wallet, mTLS off) ----
      - key: ORACLE_USER
        value: rosto_app
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false # servicio *_tp: (description=...(protocol=tcps)...(service_name=..._tp.adb.oraclecloud.com)...)
      # ---- Autenticación ----
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      # ---- Imágenes / Cloudinary ----
      - key: IMAGE_STORAGE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ---- CORS (dominio GitHub Pages) ----
      - key: CORS_ORIGIN
        value: https://sebasr0311.github.io
      # ---- Impuestos ----
      - key: IMPUESTO_PORCENTAJE
        value: 19